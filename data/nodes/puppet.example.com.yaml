---
# Node-specific configuration for the Puppet master.

profile::openvox_server::version: '8.18.0'

# Pin OpenVoxView application version
profile::openvoxview::version: '1.4.0'

# Pin OpenVox GUI release (git tag without the leading 'v'). The admin
# password lives in nodes/puppet.example.com.eyaml. 3.14.2 is the stable after
# 3.14.0: its installer now copies the openvox_enc Bolt plugin itself (fixes
# cvquesty/openvox-gui#102; openvox_gui >= 0.4.1 still installs it for older
# releases, and the two agree on content), and it needs Python >= 3.11, which
# EL10 ships as 3.12.
profile::openvox_gui::version: '3.14.2'

# The OpenVox GUI installer owns /etc/sudoers.d/openvox-gui-users (~50 rules
# for CA, Bolt, r10k, and log access). Keep profile::base's sudo purge from
# deleting it. Deliberately not a glob: the installer's timestamped
# .bak.* backups of that file are left to the purge, so the agent run
# after an install/upgrade removes them.
sudo::purge_ignore: 'openvox-gui-users'

# openvoxdb comes from the openvox8 repository like every other package. It was
# previously pinned to an April 2026 snapshot and fetched from two hardcoded
# artifact URLs, which was a workaround for 8.13.0 not being released yet; both
# it and openvoxdb-termini are in the repo at 8.15.0, so the workaround is gone.
# Direct rpm installs also resolve no dependencies, which is why that path needed
# a java_package hint the repo path does not.
profile::openvoxdb::package_version: '8.18.0-1.el10'

# Use the OS-provided PostgreSQL on EL10 (default is 16) to avoid bringing in the
# external postgresql.org repository.
openvoxdb::postgres_version: '16'

# Compilers (role::compiler) store facts and reports here over 8081, and
# profile::base's firewall rejects what is not opened. The module opens the
# SSL port with its own puppetlabs-firewall rule; the plain 8080 stays local.
openvoxdb::open_ssl_listen_port: true

# Do not manage the external PostgreSQL (PGDG) repository.
openvoxdb::manage_package_repo: false
openvoxdb::database::postgresql::manage_package_repo: false

# EL10: puppet-postgresql doesn't know EL10's default PostgreSQL version, so it
# falls into the PGDG code path with versioned paths. Override all path/service
# globals so pick() in params.pp uses the AppStream layout regardless of branch.
# DNF5 on EL10 has deprecated modularity, so manage_dnf_module must stay false.
postgresql::globals::datadir: '/var/lib/pgsql/data'
postgresql::globals::confdir: '/var/lib/pgsql/data'
postgresql::globals::bindir: '/usr/bin'
postgresql::globals::service_name: 'postgresql'
