---
# Node-specific configuration for the Puppet master.

# Pin openvox-server version
profile::openvox_server::version: '8.12.1'

# Use the OS-provided PostgreSQL on EL9 (default is 13) to avoid bringing in the
# external postgresql.org repository.
puppetdb::postgres_version: '13'

# Do not manage the external PostgreSQL (PGDG) repository.
puppetdb::manage_package_repo: false
puppetdb::database::postgresql::manage_package_repo: false

# Pabawi: enable integrations available on the Puppet master
pabawi::integrations:
  - bolt
  - puppetdb
  - puppetserver

# Bolt: use the control repo as the bolt project (bolt-project.yaml lives there)
pabawi::integrations::bolt::project_path: '/etc/puppetlabs/code/environments/production'
pabawi::integrations::bolt::command_whitelist:
  - 'plan run'
  - 'task run'

# PuppetDB: copy Puppet master SSL certs so pabawi can authenticate
pabawi::integrations::puppetdb::server_url: 'https://puppet.example.com:8081'
pabawi::integrations::puppetdb::ssl_ca_source: 'file:///etc/puppetlabs/puppet/ssl/certs/ca.pem'
pabawi::integrations::puppetdb::ssl_cert_source: 'file:///etc/puppetlabs/puppet/ssl/certs/puppet.example.com.pem'
pabawi::integrations::puppetdb::ssl_key_source: 'file:///etc/puppetlabs/puppet/ssl/private_keys/puppet.example.com.pem'

# Puppetserver: same certs work for the server API
pabawi::integrations::puppetserver::server_url: 'https://puppet.example.com:8140'
pabawi::integrations::puppetserver::ssl_ca_source: 'file:///etc/puppetlabs/puppet/ssl/certs/ca.pem'
pabawi::integrations::puppetserver::ssl_cert_source: 'file:///etc/puppetlabs/puppet/ssl/certs/puppet.example.com.pem'
pabawi::integrations::puppetserver::ssl_key_source: 'file:///etc/puppetlabs/puppet/ssl/private_keys/puppet.example.com.pem'
