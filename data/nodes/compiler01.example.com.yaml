---
# Node-specific configuration for the compiler.

# On this branch common.yaml still carries the 8.x release and agent pins,
# and every node on 9 overrides them in its own file, as the master and the
# agents do. Without these the agent is pinned to 8.30.0 while the server
# is pinned to 9.x, and dnf swaps the pair back and forth on every run.
profile::base::release: 9
profile::openvox_agent::version: '9.2.1'

# Same server package as the primary (nodes/puppet.example.com.yaml pins the
# same); the difference is what it may do, not what it installs. OpenVox 9
# stack (this is the openvox9 branch): server 9.1.0, termini 9.1.0, as on
# the primary.
profile::openvox_server::version: '9.1.0'

# A compiler, not a CA: the module keeps the CA service disabled and the
# server presenting the certificate its own agent holds from the primary. The
# profile has no parameters for these, so the module reads them from here.
# Provisioning (ovadm::add_compiler) sets the same state before the node ever
# holds a certificate; this carries it forward and stops a stock install from
# standing up a second CA.
openvox_server::ca: false
openvox_server::ca_server: 'puppet.example.com'

# openvoxdb-termini at the primary's OpenVoxDB version; the platform suffix
# (el10, el9, redhatfips9) comes from the host, so a FIPS compiler gets the
# redhatfips build.
profile::openvoxdb_terminus::package_version: '9.1.0'
