---
# The demo environment. Every host was built by ovadm::install from the
# openvox8 collection. No server version is pinned: the module keeps the one
# ovadm installed, so the first Puppet run changes nothing about the server.
openvox_server::collection: 'openvox8'

# codavox on every node that compiles catalogs. basedir is r10k's basedir on
# the primary; compilers publish nothing and only need the publisher's address
# (nodes/compiler01.example.com.yaml).
#
# codavox_tasks: 0.11.1, the first release with miharp/codavox#111, from the
# harpworks repository.
codavox::package_ensure: '0.11.1'
codavox::basedir: '/etc/puppetlabs/code/environments'
codavox::publish_allow_roles:
  - 'openvox_compiler'

# codavox_choria: Choria runs codavox::deploy and codavox::sync. The broker is
# on the primary (nodes/puppet.example.com.yaml) and a Choria server runs on
# the primary and each compiler. Task files come from the primary's OpenVox
# Server: a trigger-only compiler serves no environment until its first
# codavox::sync, so it cannot be the source of that sync's own task files.
choria::server_config:
  plugin.choria.puppetserver_host: 'puppet.example.com'
  plugin.choria.puppetserver_port: 8140
  plugin.choria.puppetca_host: 'puppet.example.com'
  plugin.choria.puppetca_port: 8140
  plugin.choria.middleware_hosts: 'puppet.example.com:4222'
  plugin.choria.use_srv: false

mcollective::plugin_classes:
  - mcollective_agent_bolt_tasks

# The one caller: a user on the primary with a certificate named
# orchestrator.mcollective, signed by the Puppet CA (the lab test makes it).
# Choria's default certname allowlist (\.mcollective$) admits it; every agent's
# policy, rpcutil's included, then allows it and denies everyone else.
mcollective::site_policies:
  - action: 'allow'
    callers: 'choria=orchestrator.mcollective'
    actions: '*'
    facts: '*'
    classes: '*'
