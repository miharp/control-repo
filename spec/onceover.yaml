# Onceover configuration — control-repo-wide compilation testing.
#
# Onceover compiles each role against a representative node factset (real facts
# captured from the Vagrant VMs, see spec/factsets/). This complements the
# per-module rspec-puppet suite in site-modules/profile by exercising the full
# role -> profile -> module composition with the control-repo's own hiera data.
#
# Run from the control-repo root:
#   bundle exec onceover run spec

# Roles under test.
classes:
  - role::demo_primary
  - role::demo_compiler
  - role::demo_agent

# Node factsets (filenames in spec/factsets/, named after each node's certname
# so that trusted.certname resolves the right nodes/%{trusted.certname}.yaml).
nodes:
  - puppet.example.com
  - compiler01.example.com
  - agent01.example.com
  - agent02.example.com

class_groups:
  master_role:
    - role::demo_primary
  compiler_role:
    - role::demo_compiler
  agent_roles:
    - role::demo_agent

node_groups:
  master:
    - puppet.example.com
  compiler:
    - compiler01.example.com
  agents:
    - agent01.example.com
    - agent02.example.com

# Map roles to the nodes they actually run on in the demo:
#   - demo_primary only on the master, whose node data names its own publisher.
#   - demo_compiler only on compiler01, whose node data turns the CA off and
#     points its codavox agent at the primary.
#   - demo_agent (the default node) on both agents (EL9 + Ubuntu 24.04).
test_matrix:
  - master:
      classes: master_role
      tests: spec
  - compiler:
      classes: compiler_role
      tests: spec
  - agents:
      classes: agent_roles
      tests: spec
